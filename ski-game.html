<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>滑雪大冒险 - Ski Adventure</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #0a0e1a;
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            overflow: hidden;
        }
        .game-wrapper {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 60px rgba(74, 144, 217, 0.2), 0 20px 60px rgba(0,0,0,0.5);
        }
        #gameCanvas {
            display: block;
            background: #000;
        }
        .ui-overlay {
            position: absolute;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            pointer-events: none;
            z-index: 10;
        }
        .ui-item {
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 8px 18px;
            border-radius: 24px;
            color: white;
            font-size: 15px;
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            letter-spacing: 1px;
        }
        .ui-item .value {
            color: #fbbf24;
        }
        .powerup-slots {
            position: absolute;
            top: 60px;
            left: 16px;
            display: flex;
            gap: 8px;
            pointer-events: none;
            z-index: 10;
        }
        .powerup-slot {
            width: 40px;
            height: 40px;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            opacity: 0.3;
            transition: opacity 0.3s;
            position: relative;
            overflow: hidden;
        }
        .powerup-slot.active {
            opacity: 1;
            border-color: rgba(251, 191, 36, 0.5);
            box-shadow: 0 0 12px rgba(251, 191, 36, 0.3);
        }
        .powerup-timer {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: rgba(255,255,255,0.2);
            overflow: hidden;
        }
        .powerup-timer-bar {
            height: 100%;
            background: #fbbf24;
            width: 0%;
            transition: width 0.1s linear;
        }
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(10, 14, 26, 0.88);
            backdrop-filter: blur(8px);
            color: white;
            z-index: 20;
            transition: opacity 0.4s;
        }
        .hidden {
            display: none !important;
        }
        h1 {
            font-size: 56px;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #87CEEB, #4a90d9, #87CEEB);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 3s linear infinite;
            text-shadow: none;
            filter: drop-shadow(0 0 20px rgba(74, 144, 217, 0.4));
        }
        @keyframes shimmer {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }
        .subtitle {
            font-size: 20px;
            margin-bottom: 40px;
            color: #94a3b8;
            letter-spacing: 2px;
        }
        .btn {
            padding: 16px 56px;
            font-size: 22px;
            background: linear-gradient(135deg, #4a90d9, #2563eb);
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            font-weight: bold;
            letter-spacing: 2px;
            box-shadow: 0 4px 20px rgba(37, 99, 235, 0.3);
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(37, 99, 235, 0.5);
        }
        .instructions {
            margin-top: 36px;
            font-size: 15px;
            color: #64748b;
            line-height: 2.2;
            text-align: center;
        }
        .instructions span {
            display: inline-block;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 3px 14px;
            border-radius: 8px;
            margin: 0 4px;
            color: #cbd5e1;
            font-family: monospace;
            font-size: 14px;
        }
        .level-popup {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(74, 144, 217, 0.3);
            padding: 30px 60px;
            border-radius: 16px;
            color: #87CEEB;
            font-size: 32px;
            font-weight: bold;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.4s, transform 0.4s;
            z-index: 15;
            box-shadow: 0 0 40px rgba(74, 144, 217, 0.2);
        }
        .level-popup.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1.05);
        }
        .high-score {
            margin-top: 8px;
            font-size: 14px;
            color: #94a3b8;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin: 16px 0 28px;
            text-align: center;
        }
        .stat-item {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 12px 20px;
        }
        .stat-label {
            font-size: 12px;
            color: #64748b;
            margin-bottom: 4px;
        }
        .stat-value {
            font-size: 22px;
            color: #fbbf24;
            font-weight: bold;
        }
        .combo-text {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fbbf24;
            font-size: 36px;
            font-weight: bold;
            pointer-events: none;
            opacity: 0;
            z-index: 12;
            text-shadow: 0 0 20px rgba(251,191,36,0.5);
            transition: opacity 0.3s;
        }
        .combo-text.show {
            opacity: 1;
            animation: comboPop 0.8s ease-out forwards;
        }
        @keyframes comboPop {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
            30% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
            100% { opacity: 0; transform: translate(-50%, -80%) scale(1); }
        }
        .pause-hint {
            position: absolute;
            top: 14px;
            right: 16px;
            font-size: 12px;
            color: rgba(255,255,255,0.35);
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div class="game-wrapper">
        <canvas id="gameCanvas" width="1000" height="500"></canvas>
        
        <div class="ui-overlay">
            <div class="ui-item">🏔️ 关卡 <span class="value" id="levelDisplay">1</span></div>
            <div class="ui-item">🏆 <span class="value" id="scoreDisplay">0</span></div>
            <div class="ui-item">🪙 <span class="value" id="coinDisplay">0</span></div>
            <div class="ui-item">🎿 <span class="value" id="distanceDisplay">0</span> m</div>
        </div>

        <div class="powerup-slots" id="powerupSlots">
            <div class="powerup-slot" id="slotShield" title="护盾">🛡️<div class="powerup-timer"><div class="powerup-timer-bar" id="timerShield"></div></div></div>
            <div class="powerup-slot" id="slotBoost" title="加速冲刺">⚡<div class="powerup-timer"><div class="powerup-timer-bar" id="timerBoost"></div></div></div>
            <div class="powerup-slot" id="slotDouble" title="双倍分数">✨<div class="powerup-timer"><div class="powerup-timer-bar" id="timerDouble"></div></div></div>
        </div>
        
        <div id="startScreen" class="screen">
            <h1>⛷️ 滑雪大冒险</h1>
            <p class="subtitle">穿越雪山，挑战极限</p>
            <button class="btn" onclick="game.start()">开始游戏</button>
            <div class="instructions">
                <p><span>↑</span> <span>空格</span> 跳跃 &nbsp;&nbsp; <span>↓</span> 蹲下 &nbsp;&nbsp; <span>P</span> 暂停</p>
                <p>躲避树木和岩石，收集金币和道具，滑得越远越好</p>
            </div>
        </div>
        
        <div id="gameOverScreen" class="screen hidden">
            <h1>💥 摔倒了</h1>
            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-label">最终分数</div>
                    <div class="stat-value" id="finalScore">0</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">收集金币</div>
                    <div class="stat-value" id="finalCoins">0</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">最远距离</div>
                    <div class="stat-value" id="finalDistance">0m</div>
                </div>
            </div>
            <p class="high-score" id="highScoreDisplay"></p>
            <button class="btn" onclick="game.restart()">再来一次</button>
        </div>

        <div id="pauseScreen" class="screen hidden">
            <h1>⏸️ 已暂停</h1>
            <p class="subtitle">按 P 继续游戏</p>
            <button class="btn" onclick="game.togglePause()">继续</button>
        </div>
        
        <div id="levelPopup" class="level-popup">进入关卡 2</div>
        <div id="comboText" class="combo-text"></div>
        <div class="pause-hint">P 暂停</div>
    </div>

    <script>
        // ==================== 配置 ====================
        const CONFIG = {
            canvasWidth: 1000,
            canvasHeight: 500,
            groundY: 380,
            gravity: 0.65,
            jumpForce: -13,
            baseSpeed: 5,
            speedIncrement: 1.2,
            levelDistance: 500,
            maxLevel: 10,
            powerupDuration: 600,
            boostSpeedMult: 1.8,
            coinValue: 50,
            comboWindow: 120
        };

        // ==================== 工具函数 ====================
        function lerp(a, b, t) { return a + (b - a) * t; }
        function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
        function rand(min, max) { return Math.random() * (max - min) + min; }

        // ==================== 精灵绘制 ====================
        const Sprite = {
            skier(ctx, x, y, state, time, invincible) {
                ctx.save();
                ctx.translate(x, y);
                if (invincible && Math.floor(time / 60) % 2 === 0) {
                    ctx.globalAlpha = 0.6;
                }
                const bob = state === 'normal' ? Math.sin(time / 90) * 2 : 0;
                ctx.translate(0, bob);
                if (state === 'ducking') {
                    ctx.translate(0, 12);
                    ctx.fillStyle = '#1e3a5f';
                    ctx.beginPath();
                    ctx.ellipse(0, -18, 20, 14, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#ff6b35';
                    ctx.beginPath();
                    ctx.arc(6, -24, 11, Math.PI, 0);
                    ctx.fill();
                    ctx.fillStyle = '#38bdf8';
                    ctx.beginPath();
                    ctx.ellipse(8, -24, 8, 4, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#dc2626';
                    ctx.save();
                    ctx.rotate(0.05);
                    ctx.fillRect(-28, -2, 56, 6);
                    ctx.fillRect(-28, 6, 56, 6);
                    ctx.restore();
                } else if (state === 'jumping') {
                    ctx.rotate(-0.25);
                    ctx.fillStyle = '#1e3a5f';
                    ctx.fillRect(-9, -38, 18, 28);
                    ctx.fillStyle = '#fdbf60';
                    ctx.beginPath();
                    ctx.arc(0, -44, 10, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#ff6b35';
                    ctx.beginPath();
                    ctx.arc(0, -46, 11, Math.PI, 0);
                    ctx.fill();
                    ctx.fillStyle = '#38bdf8';
                    ctx.fillRect(-7, -48, 14, 6);
                    ctx.fillStyle = 'rgba(255,255,255,0.4)';
                    ctx.fillRect(-4, -47, 6, 3);
                    ctx.strokeStyle = '#1e3a5f';
                    ctx.lineWidth = 5;
                    ctx.lineCap = 'round';
                    ctx.beginPath();
                    ctx.moveTo(-6, -32);
                    ctx.lineTo(-18, -50);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(6, -32);
                    ctx.lineTo(18, -50);
                    ctx.stroke();
                    ctx.fillStyle = '#dc2626';
                    const sw = Math.sin(time / 60) * 8;
                    ctx.beginPath();
                    ctx.moveTo(-6, -34);
                    ctx.lineTo(-30 - sw, -42 + sw * 0.2);
                    ctx.lineTo(-28 - sw, -34 + sw * 0.2);
                    ctx.lineTo(-4, -28);
                    ctx.closePath();
                    ctx.fill();
                    ctx.fillStyle = '#dc2626';
                    ctx.save();
                    ctx.rotate(-0.15);
                    ctx.fillRect(-30, -4, 60, 6);
                    ctx.fillRect(-30, 5, 60, 6);
                    ctx.restore();
                } else {
                    ctx.fillStyle = 'rgba(0,0,0,0.15)';
                    ctx.beginPath();
                    ctx.ellipse(0, 2, 22, 5, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#1e3a5f';
                    ctx.fillRect(-9, -38, 18, 28);
                    ctx.fillStyle = '#2d4a6f';
                    ctx.fillRect(-9, -30, 18, 3);
                    ctx.fillRect(-9, -20, 18, 3);
                    ctx.fillStyle = '#fdbf60';
                    ctx.beginPath();
                    ctx.arc(0, -44, 10, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#ff6b35';
                    ctx.beginPath();
                    ctx.arc(0, -46, 11, Math.PI, 0);
                    ctx.fill();
                    ctx.fillStyle = '#e55a2b';
                    ctx.beginPath();
                    ctx.arc(0, -46, 11, 0, Math.PI);
                    ctx.fill();
                    ctx.fillStyle = '#38bdf8';
                    ctx.beginPath();
                    ctx.ellipse(0, -46, 9, 5, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = 'rgba(255,255,255,0.5)';
                    ctx.fillRect(-4, -48, 5, 3);
                    ctx.fillStyle = '#dc2626';
                    const scarfX = Math.sin(time / 70) * 10;
                    const scarfY = Math.cos(time / 70) * 3;
                    ctx.beginPath();
                    ctx.moveTo(-6, -34);
                    ctx.lineTo(-28 - scarfX, -30 + scarfY);
                    ctx.lineTo(-26 - scarfX, -24 + scarfY);
                    ctx.lineTo(-4, -28);
                    ctx.closePath();
                    ctx.fill();
                    ctx.fillStyle = '#b91c1c';
                    ctx.beginPath();
                    ctx.moveTo(-6, -34);
                    ctx.lineTo(-24 - scarfX, -28 + scarfY);
                    ctx.lineTo(-22 - scarfX, -24 + scarfY);
                    ctx.lineTo(-4, -28);
                    ctx.closePath();
                    ctx.fill();
                    ctx.strokeStyle = '#1e3a5f';
                    ctx.lineWidth = 4;
                    ctx.lineCap = 'round';
                    ctx.beginPath();
                    ctx.moveTo(-6, -32);
                    ctx.lineTo(-14, -16);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(6, -32);
                    ctx.lineTo(14, -16);
                    ctx.stroke();
                    ctx.strokeStyle = '#94a3b8';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(-14, -16);
                    ctx.lineTo(-20, 6);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(14, -16);
                    ctx.lineTo(20, 6);
                    ctx.stroke();
                    ctx.fillStyle = '#64748b';
                    ctx.beginPath();
                    ctx.arc(-20, 6, 2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(20, 6, 2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#1e3a5f';
                    ctx.fillRect(-8, -12, 6, 12);
                    ctx.fillRect(2, -12, 6, 12);
                    ctx.fillStyle = '#451a03';
                    ctx.fillRect(-10, -2, 10, 5);
                    ctx.fillRect(0, -2, 10, 5);
                    ctx.fillStyle = '#dc2626';
                    ctx.fillRect(-32, -2, 64, 5);
                    ctx.fillRect(-32, 5, 64, 5);
                    ctx.fillStyle = 'rgba(255,255,255,0.2)';
                    ctx.fillRect(-32, -2, 64, 2);
                    ctx.fillRect(-32, 5, 64, 2);
                    ctx.fillStyle = '#dc2626';
                    ctx.beginPath();
                    ctx.ellipse(-32, 0.5, 6, 4, -0.3, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.ellipse(-32, 7.5, 6, 4, -0.3, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            },
            
            tree(ctx, x, y, size = 1) {
                ctx.save();
                ctx.translate(x, y);
                ctx.scale(size, size);
                ctx.fillStyle = 'rgba(0,0,0,0.1)';
                ctx.beginPath();
                ctx.ellipse(0, 0, 18, 4, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#3d2314';
                ctx.fillRect(-4, -22, 8, 22);
                ctx.fillStyle = '#5d3a1a';
                ctx.fillRect(-3, -20, 2, 18);
                const layers = [
                    { y: -85, w: 30, h: 55, c: '#064e3b' },
                    { y: -70, w: 26, h: 50, c: '#065f46' },
                    { y: -55, w: 22, h: 45, c: '#047857' },
                    { y: -40, w: 18, h: 35, c: '#059669' }
                ];
                for (const layer of layers) {
                    ctx.fillStyle = layer.c;
                    ctx.beginPath();
                    ctx.moveTo(0, layer.y - layer.h);
                    ctx.lineTo(-layer.w, layer.y);
                    ctx.lineTo(layer.w, layer.y);
                    ctx.closePath();
                    ctx.fill();
                }
                ctx.fillStyle = '#f8fafc';
                ctx.beginPath();
                ctx.moveTo(0, -85);
                ctx.lineTo(-10, -68);
                ctx.lineTo(10, -68);
                ctx.closePath();
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(0, -70);
                ctx.lineTo(-8, -55);
                ctx.lineTo(8, -55);
                ctx.closePath();
                ctx.fill();
                ctx.strokeStyle = 'rgba(255,255,255,0.1)';
                ctx.lineWidth = 1;
                for (let i = 0; i < 5; i++) {
                    const ay = -75 + i * 12;
                    ctx.beginPath();
                    ctx.moveTo(-5, ay);
                    ctx.lineTo(-12, ay + 8);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(5, ay);
                    ctx.lineTo(12, ay + 8);
                    ctx.stroke();
                }
                ctx.restore();
            },
            
            rock(ctx, x, y, size = 1) {
                ctx.save();
                ctx.translate(x, y);
                ctx.scale(size, size);
                ctx.fillStyle = 'rgba(0,0,0,0.15)';
                ctx.beginPath();
                ctx.ellipse(0, 2, 20, 5, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#4b5563';
                ctx.beginPath();
                ctx.moveTo(-18, 0);
                ctx.lineTo(-12, -30);
                ctx.lineTo(-2, -42);
                ctx.lineTo(10, -38);
                ctx.lineTo(18, -22);
                ctx.lineTo(20, -8);
                ctx.lineTo(16, 0);
                ctx.closePath();
                ctx.fill();
                ctx.fillStyle = '#6b7280';
                ctx.beginPath();
                ctx.moveTo(-6, -5);
                ctx.lineTo(-3, -28);
                ctx.lineTo(6, -24);
                ctx.lineTo(8, -10);
                ctx.lineTo(3, -4);
                ctx.closePath();
                ctx.fill();
                ctx.strokeStyle = '#374151';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(-5, -15);
                ctx.lineTo(2, -20);
                ctx.lineTo(5, -12);
                ctx.stroke();
                ctx.fillStyle = '#f1f5f9';
                ctx.beginPath();
                ctx.ellipse(0, -2, 18, 5, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            },
            
            snowman(ctx, x, y) {
                ctx.save();
                ctx.translate(x, y);
                ctx.fillStyle = 'rgba(0,0,0,0.1)';
                ctx.beginPath();
                ctx.ellipse(0, 2, 18, 4, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#f8fafc';
                ctx.beginPath();
                ctx.arc(0, -16, 16, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = 'rgba(200,220,240,0.3)';
                ctx.beginPath();
                ctx.arc(-4, -20, 10, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#f8fafc';
                ctx.beginPath();
                ctx.arc(0, -42, 12, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = 'rgba(200,220,240,0.3)';
                ctx.beginPath();
                ctx.arc(-3, -46, 7, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#1f2937';
                ctx.beginPath();
                ctx.arc(-4, -44, 2.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(4, -44, 2.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = 'white';
                ctx.beginPath();
                ctx.arc(-3, -45, 0.8, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(5, -45, 0.8, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#f97316';
                ctx.beginPath();
                ctx.moveTo(0, -41);
                ctx.lineTo(10, -38);
                ctx.lineTo(0, -35);
                ctx.closePath();
                ctx.fill();
                ctx.fillStyle = '#1f2937';
                for (let i = -1; i <= 1; i++) {
                    ctx.beginPath();
                    ctx.arc(i * 3, -33, 1, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.fillStyle = '#1f2937';
                ctx.beginPath();
                ctx.arc(0, -20, 1.8, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(0, -14, 1.8, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(0, -8, 1.8, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#5d3a1a';
                ctx.lineWidth = 2.5;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(-12, -22);
                ctx.lineTo(-26, -32);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(12, -22);
                ctx.lineTo(24, -30);
                ctx.lineTo(28, -28);
                ctx.stroke();
                ctx.fillStyle = '#1e3a5f';
                ctx.fillRect(-10, -58, 20, 12);
                ctx.fillRect(-14, -48, 28, 3);
                ctx.fillStyle = '#dc2626';
                ctx.fillRect(-10, -52, 20, 3);
                ctx.fillStyle = '#fbbf24';
                ctx.beginPath();
                ctx.arc(6, -50, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            },
            
            bird(ctx, x, y, time) {
                ctx.save();
                ctx.translate(x, y);
                const wingY = Math.sin(time / 100) * 6;
                ctx.fillStyle = '#1f2937';
                ctx.beginPath();
                ctx.ellipse(0, 0, 10, 4, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(-8, 0);
                ctx.lineTo(-16, -wingY);
                ctx.lineTo(-4, 0);
                ctx.closePath();
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(4, 0);
                ctx.lineTo(12, -wingY - 2);
                ctx.lineTo(8, 0);
                ctx.closePath();
                ctx.fill();
                ctx.restore();
            },
            
            cloud(ctx, x, y, size) {
                ctx.save();
                ctx.translate(x, y);
                ctx.scale(size, size);
                ctx.fillStyle = 'rgba(255,255,255,0.6)';
                ctx.beginPath();
                ctx.arc(0, 0, 20, 0, Math.PI * 2);
                ctx.arc(18, -5, 16, 0, Math.PI * 2);
                ctx.arc(35, 0, 14, 0, Math.PI * 2);
                ctx.arc(12, -12, 14, 0, Math.PI * 2);
                ctx.arc(28, -10, 12, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            },

            coin(ctx, x, y, time) {
                ctx.save();
                ctx.translate(x, y);
                const bounce = Math.sin(time / 80) * 3;
                ctx.translate(0, bounce);
                const scaleX = Math.abs(Math.sin(time / 150));
                ctx.scale(scaleX * 0.8 + 0.2, 1);
                ctx.fillStyle = '#fbbf24';
                ctx.beginPath();
                ctx.arc(0, 0, 14, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#f59e0b';
                ctx.beginPath();
                ctx.arc(0, 0, 10, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#fde68a';
                ctx.beginPath();
                ctx.arc(-3, -3, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            },

            powerup(ctx, x, y, type, time) {
                ctx.save();
                ctx.translate(x, y);
                const hover = Math.sin(time / 100) * 4;
                ctx.translate(0, hover);
                const glow = ctx.createRadialGradient(0, 0, 8, 0, 0, 28);
                glow.addColorStop(0, 'rgba(251,191,36,0.4)');
                glow.addColorStop(1, 'rgba(251,191,36,0)');
                ctx.fillStyle = glow;
                ctx.beginPath();
                ctx.arc(0, 0, 28, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = 'rgba(255,255,255,0.15)';
                ctx.beginPath();
                ctx.arc(0, 0, 18, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = 'rgba(255,255,255,0.4)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(0, 0, 18, 0, Math.PI * 2);
                ctx.stroke();
                ctx.font = '18px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(
                    type === 'shield' ? '🛡️' : type === 'boost' ? '⚡' : '✨',
                    0, 1
                );
                ctx.restore();
            },

            floatingText(ctx, text, x, y, alpha) {
                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.fillStyle = '#fbbf24';
                ctx.font = 'bold 18px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(text, x, y);
                ctx.restore();
            }
        };

        // ==================== 游戏主类 ====================
        class SkiGame {
            constructor() {
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.width = CONFIG.canvasWidth;
                this.height = CONFIG.canvasHeight;
                this.groundY = CONFIG.groundY;
                this.time = 0;
                
                this.state = 'menu';
                this.score = 0;
                this.distance = 0;
                this.level = 1;
                this.speed = CONFIG.baseSpeed;
                this.coins = 0;
                this.highScore = parseInt(localStorage.getItem('skiHighScore') || '0');
                this.totalCoins = parseInt(localStorage.getItem('skiTotalCoins') || '0');
                
                this.player = {
                    x: 100,
                    y: this.groundY,
                    vy: 0,
                    jumping: false,
                    ducking: false,
                    onGround: true
                };
                
                this.obstacles = [];
                this.particles = [];
                this.snowflakes = [];
                this.clouds = [];
                this.birds = [];
                this.groundLines = [];
                this.coinsArr = [];
                this.powerups = [];
                this.floatingTexts = [];
                
                this.activePowerups = {
                    shield: 0,
                    boost: 0,
                    double: 0
                };
                
                this.combo = 0;
                this.comboTimer = 0;
                
                this.frameCount = 0;
                this.lastObstacleTime = 0;
                
                this.init();
            }
            
            init() {
                this.setupInputs();
                this.initSnowflakes();
                this.initClouds();
                this.initGroundLines();
                this.loop();
            }
            
            setupInputs() {
                document.addEventListener('keydown', (e) => {
                    if (e.code === 'KeyP') {
                        e.preventDefault();
                        this.togglePause();
                        return;
                    }
                    if (this.state !== 'playing') {
                        if (e.code === 'Space' || e.code === 'Enter') {
                            e.preventDefault();
                            if (this.state === 'menu') this.start();
                            else if (this.state === 'gameover') this.restart();
                            else if (this.state === 'paused') this.togglePause();
                        }
                        return;
                    }
                    
                    if ((e.code === 'Space' || e.code === 'ArrowUp') && this.player.onGround) {
                        e.preventDefault();
                        this.jump();
                    }
                    if (e.code === 'ArrowDown') {
                        e.preventDefault();
                        this.player.ducking = true;
                    }
                });
                
                document.addEventListener('keyup', (e) => {
                    if (e.code === 'ArrowDown') this.player.ducking = false;
                });
                
                let touchStartY = 0;
                this.canvas.addEventListener('touchstart', (e) => {
                    touchStartY = e.touches[0].clientY;
                    if (this.state === 'menu') this.start();
                    else if (this.state === 'gameover') this.restart();
                    else if (this.state === 'paused') this.togglePause();
                    else if (this.state === 'playing' && this.player.onGround) this.jump();
                }, { passive: false });
                
                this.canvas.addEventListener('touchmove', (e) => {
                    if (this.state !== 'playing') return;
                    e.preventDefault();
                    const deltaY = e.touches[0].clientY - touchStartY;
                    this.player.ducking = deltaY > 30;
                }, { passive: false });
                
                this.canvas.addEventListener('touchend', () => {
                    this.player.ducking = false;
                });
            }
            
            togglePause() {
                if (this.state === 'playing') {
                    this.state = 'paused';
                    document.getElementById('pauseScreen').classList.remove('hidden');
                } else if (this.state === 'paused') {
                    this.state = 'playing';
                    document.getElementById('pauseScreen').classList.add('hidden');
                }
            }
            
            initSnowflakes() {
                for (let i = 0; i < 80; i++) {
                    this.snowflakes.push({
                        x: Math.random() * this.width,
                        y: Math.random() * this.height,
                        size: Math.random() * 3 + 0.5,
                        speed: Math.random() * 1.5 + 0.3,
                        drift: (Math.random() - 0.5) * 0.5
                    });
                }
            }
            
            initClouds() {
                for (let i = 0; i < 6; i++) {
                    this.clouds.push({
                        x: Math.random() * this.width,
                        y: Math.random() * 120 + 20,
                        size: Math.random() * 0.6 + 0.4,
                        speed: Math.random() * 0.3 + 0.1
                    });
                }
            }
            
            initGroundLines() {
                for (let i = 0; i < 30; i++) {
                    this.groundLines.push({
                        x: Math.random() * this.width,
                        y: this.groundY + Math.random() * (this.height - this.groundY),
                        length: Math.random() * 60 + 20,
                        width: Math.random() * 2 + 0.5
                    });
                }
            }
            
            jump() {
                this.player.vy = CONFIG.jumpForce;
                this.player.jumping = true;
                this.player.onGround = false;
                this.createSnowBurst(this.player.x, this.player.y, 12);
            }
            
            start() {
                this.state = 'playing';
                this.score = 0;
                this.distance = 0;
                this.level = 1;
                this.speed = CONFIG.baseSpeed;
                this.coins = 0;
                this.player.y = this.groundY;
                this.player.vy = 0;
                this.player.jumping = false;
                this.player.ducking = false;
                this.player.onGround = true;
                this.obstacles = [];
                this.particles = [];
                this.birds = [];
                this.coinsArr = [];
                this.powerups = [];
                this.floatingTexts = [];
                this.activePowerups = { shield: 0, boost: 0, double: 0 };
                this.combo = 0;
                this.comboTimer = 0;
                this.frameCount = 0;
                this.lastObstacleTime = 0;
                
                document.getElementById('startScreen').classList.add('hidden');
                document.getElementById('gameOverScreen').classList.add('hidden');
                document.getElementById('pauseScreen').classList.add('hidden');
                this.updateUI();
                this.updatePowerupUI();
            }
            
            restart() {
                this.start();
            }
            
            gameOver() {
                this.state = 'gameover';
                if (this.score > this.highScore) {
                    this.highScore = this.score;
                    localStorage.setItem('skiHighScore', this.highScore.toString());
                }
                this.totalCoins += this.coins;
                localStorage.setItem('skiTotalCoins', this.totalCoins.toString());
                
                document.getElementById('finalScore').textContent = Math.floor(this.score);
                document.getElementById('finalCoins').textContent = this.coins;
                document.getElementById('finalDistance').textContent = Math.floor(this.distance) + 'm';
                document.getElementById('highScoreDisplay').textContent = 
                    `最高纪录 ${Math.floor(this.highScore)}  ·  累计金币 ${this.totalCoins}`;
                document.getElementById('gameOverScreen').classList.remove('hidden');
            }
            
            update() {
                this.time += 16;
                if (this.state === 'paused') return;
                if (this.state !== 'playing') {
                    this.updateSnowflakes();
                    this.updateClouds();
                    return;
                }
                
                this.frameCount++;
                
                const effectiveSpeed = this.activePowerups.boost > 0 
                    ? this.speed * CONFIG.boostSpeedMult 
                    : this.speed;
                
                this.distance += effectiveSpeed / 10;
                const scoreMult = this.activePowerups.double > 0 ? 2 : 1;
                this.score += effectiveSpeed / 20 * scoreMult;
                
                const newLevel = Math.min(Math.floor(this.distance / CONFIG.levelDistance) + 1, CONFIG.maxLevel);
                if (newLevel > this.level) {
                    this.level = newLevel;
                    this.speed = CONFIG.baseSpeed + (this.level - 1) * CONFIG.speedIncrement;
                    this.showLevelPopup();
                }
                
                this.updatePlayer();
                this.spawnObstacles();
                this.updateObstacles();
                this.spawnCoins();
                this.updateCoins();
                this.spawnPowerups();
                this.updatePowerups();
                this.updateParticles();
                this.updateSnowflakes();
                this.updateClouds();
                this.updateBirds();
                this.updateGroundLines();
                this.updateFloatingTexts();
                this.updatePowerupTimers();
                this.updateCombo();
                this.checkCollisions();
                this.updateUI();
            }
            
            updatePlayer() {
                const p = this.player;
                p.vy += CONFIG.gravity;
                p.y += p.vy;
                
                if (p.y >= this.groundY) {
                    p.y = this.groundY;
                    p.vy = 0;
                    p.jumping = false;
                    p.onGround = true;
                }
                
                if (p.onGround && this.frameCount % 4 === 0) {
                    this.createSnowTrail(p.x - 20, p.y, 2);
                }
            }
            
            spawnObstacles() {
                const minGap = Math.max(55, 160 - this.level * 8);
                const randomGap = Math.random() * minGap;
                
                if (this.frameCount - this.lastObstacleTime > minGap + randomGap) {
                    const types = ['tree'];
                    if (this.level >= 2) types.push('tree');
                    if (this.level >= 3) types.push('rock');
                    if (this.level >= 4) types.push('snowman');
                    if (this.level >= 5) types.push('rock', 'tree');
                    
                    const type = types[Math.floor(Math.random() * types.length)];
                    const size = 0.7 + Math.random() * 0.4;
                    let y = this.groundY;
                    let height = 50;
                    
                    if (type === 'tree') height = 70 * size;
                    else if (type === 'rock') height = 35 * size;
                    else if (type === 'snowman') height = 50;
                    
                    let flying = false;
                    if (this.level >= 3 && Math.random() < 0.18) {
                        y = this.groundY - 65;
                        flying = true;
                        height = 35;
                    }
                    
                    this.obstacles.push({
                        type, x: this.width + 60, y,
                        width: 35 * size, height,
                        size, flying, passed: false
                    });
                    
                    this.lastObstacleTime = this.frameCount;
                }
                
                if (this.level >= 4 && Math.random() < 0.005) {
                    this.birds.push({
                        x: this.width + 50,
                        y: rand(60, 180),
                        speed: this.speed * 0.6
                    });
                }
            }
            
            updateObstacles() {
                const effectiveSpeed = this.activePowerups.boost > 0 
                    ? this.speed * CONFIG.boostSpeedMult 
                    : this.speed;
                for (let i = this.obstacles.length - 1; i >= 0; i--) {
                    const obs = this.obstacles[i];
                    obs.x -= effectiveSpeed;
                    if (!obs.passed && obs.x + obs.width < this.player.x) {
                        obs.passed = true;
                        this.score += 10 * (this.activePowerups.double > 0 ? 2 : 1);
                        this.addCombo();
                    }
                    if (obs.x < -120) this.obstacles.splice(i, 1);
                }
            }
            
            spawnCoins() {
                // 检查右侧即将进入的区域是否有障碍物，保持安全距离
                for (const obs of this.obstacles) {
                    if (obs.x > this.width && obs.x < this.width + 350) return;
                }
                // 避免金币太密集
                for (const c of this.coinsArr) {
                    if (c.x > this.width - 80) return;
                }
                
                if (Math.random() < 0.012 + this.level * 0.002) {
                    // 定义收集轨道，避开空中障碍物高度(groundY-65)
                    const tracks = [
                        this.groundY - 32,   // 地面轨道：滑行可捡
                        this.groundY - 50,   // 低跳轨道：避开空中障碍
                        this.groundY - 88,   // 高跳轨道
                        this.groundY - 120   // 极限轨道
                    ];
                    
                    const pattern = Math.floor(Math.random() * 4);
                    const track = tracks[Math.floor(Math.random() * tracks.length)];
                    const startX = this.width + 60;
                    
                    if (pattern === 0) {
                        // 单币
                        this.coinsArr.push({ x: startX, y: track, collected: false });
                    } else if (pattern === 1) {
                        // 水平三连
                        for (let i = 0; i < 3; i++) {
                            this.coinsArr.push({ x: startX + i * 42, y: track, collected: false });
                        }
                    } else if (pattern === 2) {
                        // 阶梯上升（引导玩家跳跃）
                        for (let i = 0; i < 4; i++) {
                            const stepY = this.groundY - 35 - i * 28;
                            this.coinsArr.push({ x: startX + i * 38, y: stepY, collected: false });
                        }
                    } else {
                        // 平缓弧线
                        for (let i = 0; i < 5; i++) {
                            const arcY = this.groundY - 45 - Math.sin(i * 0.5) * 55;
                            this.coinsArr.push({ x: startX + i * 38, y: arcY, collected: false });
                        }
                    }
                }
            }
            
            updateCoins() {
                const effectiveSpeed = this.activePowerups.boost > 0 
                    ? this.speed * CONFIG.boostSpeedMult 
                    : this.speed;
                for (let i = this.coinsArr.length - 1; i >= 0; i--) {
                    const c = this.coinsArr[i];
                    c.x -= effectiveSpeed;
                    if (c.x < -40) this.coinsArr.splice(i, 1);
                }
            }
            
            spawnPowerups() {
                if (Math.random() < 0.002 + this.level * 0.0005) {
                    const types = ['shield', 'boost', 'double'];
                    const type = types[Math.floor(Math.random() * types.length)];
                    const y = this.groundY - rand(30, 140);
                    this.powerups.push({
                        type, x: this.width + 40, y,
                        collected: false
                    });
                }
            }
            
            updatePowerups() {
                const effectiveSpeed = this.activePowerups.boost > 0 
                    ? this.speed * CONFIG.boostSpeedMult 
                    : this.speed;
                for (let i = this.powerups.length - 1; i >= 0; i--) {
                    const p = this.powerups[i];
                    p.x -= effectiveSpeed;
                    if (p.x < -40) this.powerups.splice(i, 1);
                }
            }
            
            addCombo() {
                this.combo++;
                this.comboTimer = CONFIG.comboWindow;
                if (this.combo >= 3) {
                    const bonus = this.combo * 5;
                    this.score += bonus;
                    this.showFloatingText(`+${bonus} 连击x${this.combo}!`, this.player.x, this.player.y - 60);
                }
            }
            
            updateCombo() {
                if (this.comboTimer > 0) {
                    this.comboTimer--;
                    if (this.comboTimer <= 0) {
                        this.combo = 0;
                    }
                }
            }
            
            updateParticles() {
                for (let i = this.particles.length - 1; i >= 0; i--) {
                    const p = this.particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.life--;
                    p.alpha = p.life / p.maxLife;
                    if (p.life <= 0) this.particles.splice(i, 1);
                }
            }
            
            updateSnowflakes() {
                const moveSpeed = this.state === 'playing' 
                    ? (this.activePowerups.boost > 0 ? this.speed * CONFIG.boostSpeedMult * 0.1 : this.speed * 0.1)
                    : 0.3;
                for (const f of this.snowflakes) {
                    f.x -= moveSpeed;
                    f.x += f.drift;
                    f.y += f.speed;
                    if (f.x < 0) f.x = this.width;
                    if (f.y > this.height) {
                        f.y = -5;
                        f.x = Math.random() * this.width;
                    }
                }
            }
            
            updateClouds() {
                for (const c of this.clouds) {
                    c.x -= c.speed + (this.state === 'playing' ? this.speed * 0.05 : 0);
                    if (c.x < -150) {
                        c.x = this.width + 100;
                        c.y = rand(20, 140);
                    }
                }
            }
            
            updateBirds() {
                for (let i = this.birds.length - 1; i >= 0; i--) {
                    const b = this.birds[i];
                    b.x -= b.speed;
                    b.y += Math.sin(this.time / 300 + i) * 0.5;
                    if (b.x < -50) this.birds.splice(i, 1);
                }
            }
            
            updateGroundLines() {
                const effectiveSpeed = this.activePowerups.boost > 0 
                    ? this.speed * CONFIG.boostSpeedMult 
                    : this.speed;
                for (const line of this.groundLines) {
                    line.x -= effectiveSpeed;
                    if (line.x + line.length < 0) {
                        line.x = this.width + Math.random() * 100;
                        line.y = this.groundY + Math.random() * (this.height - this.groundY);
                    }
                }
            }
            
            updateFloatingTexts() {
                for (let i = this.floatingTexts.length - 1; i >= 0; i--) {
                    const ft = this.floatingTexts[i];
                    ft.y -= 1.5;
                    ft.life--;
                    ft.alpha = ft.life / ft.maxLife;
                    if (ft.life <= 0) this.floatingTexts.splice(i, 1);
                }
            }
            
            updatePowerupTimers() {
                for (const key of Object.keys(this.activePowerups)) {
                    if (this.activePowerups[key] > 0) {
                        this.activePowerups[key]--;
                    }
                }
                this.updatePowerupUI();
            }
            
            showFloatingText(text, x, y) {
                this.floatingTexts.push({
                    text, x, y,
                    life: 50,
                    maxLife: 50,
                    alpha: 1
                });
            }
            
            createSnowBurst(x, y, count) {
                for (let i = 0; i < count; i++) {
                    this.particles.push({
                        x, y,
                        vx: (Math.random() - 0.5) * 5,
                        vy: (Math.random() - 0.5) * 5 - 1,
                        life: rand(20, 40),
                        maxLife: 40,
                        alpha: 1,
                        color: 'rgba(255,255,255,0.9)',
                        size: rand(2, 5)
                    });
                }
            }
            
            createSnowTrail(x, y, count) {
                for (let i = 0; i < count; i++) {
                    this.particles.push({
                        x: x + rand(-5, 5),
                        y: y + rand(-3, 3),
                        vx: -rand(1, 3),
                        vy: -rand(0.5, 2),
                        life: rand(15, 30),
                        maxLife: 30,
                        alpha: 1,
                        color: 'rgba(255,255,255,0.6)',
                        size: rand(1, 3)
                    });
                }
            }
            
            createSparkle(x, y, color = '#fbbf24') {
                for (let i = 0; i < 10; i++) {
                    this.particles.push({
                        x, y,
                        vx: (Math.random() - 0.5) * 6,
                        vy: (Math.random() - 0.5) * 6 - 2,
                        life: rand(20, 35),
                        maxLife: 35,
                        alpha: 1,
                        color: color,
                        size: rand(2, 4)
                    });
                }
            }
            
            checkCollisions() {
                const p = this.player;
                let pTop = p.y - (p.ducking ? 28 : 55);
                let pBottom = p.y;
                let pLeft = p.x - 16;
                let pRight = p.x + 16;
                
                const isInvincible = this.activePowerups.boost > 0;
                
                for (const obs of this.obstacles) {
                    const obsTop = obs.y - obs.height;
                    const obsBottom = obs.y;
                    const obsLeft = obs.x - obs.width / 2;
                    const obsRight = obs.x + obs.width / 2;
                    
                    if (pRight > obsLeft + 5 && pLeft < obsRight - 5 &&
                        pBottom > obsTop + 5 && pTop < obsBottom - 5) {
                        
                        if (this.activePowerups.shield > 0) {
                            this.activePowerups.shield = 0;
                            this.createSparkle(p.x, p.y, '#60a5fa');
                            this.showFloatingText('护盾抵消!', p.x, p.y - 50);
                            obs.x = -200;
                            continue;
                        }
                        
                        if (!isInvincible) {
                            this.createSnowBurst(p.x, p.y, 20);
                            this.gameOver();
                            return;
                        }
                    }
                }
                
                for (const c of this.coinsArr) {
                    if (c.collected) continue;
                    const dx = p.x - c.x;
                    const dy = (p.y - 25) - c.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 30) {
                        c.collected = true;
                        this.coins++;
                        const mult = this.activePowerups.double > 0 ? 2 : 1;
                        const val = CONFIG.coinValue * mult;
                        this.score += val;
                        this.createSparkle(c.x, c.y, '#fbbf24');
                        this.showFloatingText(`+${val}`, c.x, c.y - 20);
                    }
                }
                
                for (const pu of this.powerups) {
                    if (pu.collected) continue;
                    const dx = p.x - pu.x;
                    const dy = (p.y - 25) - pu.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 30) {
                        pu.collected = true;
                        this.activePowerups[pu.type] = CONFIG.powerupDuration;
                        const names = { shield: '护盾', boost: '加速冲刺', double: '双倍分数' };
                        this.createSparkle(pu.x, pu.y, '#a78bfa');
                        this.showFloatingText(names[pu.type] + '!', pu.x, pu.y - 25);
                    }
                }
            }
            
            updateUI() {
                document.getElementById('levelDisplay').textContent = this.level;
                document.getElementById('scoreDisplay').textContent = Math.floor(this.score);
                document.getElementById('coinDisplay').textContent = this.coins;
                document.getElementById('distanceDisplay').textContent = Math.floor(this.distance);
            }
            
            updatePowerupUI() {
                const slots = {
                    shield: { slot: 'slotShield', timer: 'timerShield' },
                    boost: { slot: 'slotBoost', timer: 'timerBoost' },
                    double: { slot: 'slotDouble', timer: 'timerDouble' }
                };
                for (const [key, { slot, timer }] of Object.entries(slots)) {
                    const el = document.getElementById(slot);
                    const bar = document.getElementById(timer);
                    if (this.activePowerups[key] > 0) {
                        el.classList.add('active');
                        const pct = (this.activePowerups[key] / CONFIG.powerupDuration) * 100;
                        bar.style.width = pct + '%';
                    } else {
                        el.classList.remove('active');
                        bar.style.width = '0%';
                    }
                }
            }
            
            showLevelPopup() {
                const popup = document.getElementById('levelPopup');
                popup.textContent = `🏔️ 进入关卡 ${this.level}`;
                popup.classList.add('show');
                setTimeout(() => popup.classList.remove('show'), 2200);
            }
            
            draw() {
                const ctx = this.ctx;
                ctx.clearRect(0, 0, this.width, this.height);
                
                this.drawSky(ctx);
                this.drawSunMoon(ctx);
                this.drawClouds(ctx);
                this.drawMountains(ctx);
                this.drawHills(ctx);
                this.drawGround(ctx);
                this.drawGroundDetail(ctx);
                this.drawCoins(ctx);
                this.drawPowerups(ctx);
                this.drawObstacles(ctx);
                this.drawPlayer(ctx);
                this.drawParticles(ctx);
                this.drawFloatingTexts(ctx);
                this.drawBirds(ctx);
                this.drawSnowflakes(ctx);
                
                if (this.level >= 6 && this.state === 'playing') {
                    this.drawWindEffect(ctx);
                }
                
                if (this.level > 6) {
                    const grad = ctx.createRadialGradient(
                        this.width / 2, this.height / 2, this.height * 0.4,
                        this.width / 2, this.height / 2, this.height * 0.8
                    );
                    grad.addColorStop(0, 'rgba(0,0,0,0)');
                    grad.addColorStop(1, 'rgba(0,0,0,0.3)');
                    ctx.fillStyle = grad;
                    ctx.fillRect(0, 0, this.width, this.height);
                }
            }
            
            getSkyColors() {
                if (this.level <= 2) {
                    return { top: '#3b82f6', mid: '#60a5fa', bottom: '#bfdbfe' };
                } else if (this.level <= 4) {
                    return { top: '#1e40af', mid: '#f59e0b', bottom: '#fcd34d' };
                } else if (this.level <= 6) {
                    return { top: '#1e3a5f', mid: '#c2410c', bottom: '#fb923c' };
                } else {
                    return { top: '#0f172a', mid: '#1e293b', bottom: '#334155' };
                }
            }
            
            drawSky(ctx) {
                const c = this.getSkyColors();
                const grad = ctx.createLinearGradient(0, 0, 0, this.groundY);
                grad.addColorStop(0, c.top);
                grad.addColorStop(0.5, c.mid);
                grad.addColorStop(1, c.bottom);
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, this.width, this.groundY);
            }
            
            drawSunMoon(ctx) {
                if (this.level <= 6) {
                    const sx = this.width - 140, sy = 80;
                    const glow = ctx.createRadialGradient(sx, sy, 10, sx, sy, 80);
                    glow.addColorStop(0, 'rgba(251, 191, 36, 0.3)');
                    glow.addColorStop(1, 'rgba(251, 191, 36, 0)');
                    ctx.fillStyle = glow;
                    ctx.beginPath();
                    ctx.arc(sx, sy, 80, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#fbbf24';
                    ctx.beginPath();
                    ctx.arc(sx, sy, 22, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#f59e0b';
                    ctx.beginPath();
                    ctx.arc(sx, sy, 18, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    const mx = this.width - 140, my = 80;
                    ctx.fillStyle = '#e2e8f0';
                    ctx.beginPath();
                    ctx.arc(mx, my, 18, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = this.getSkyColors().top;
                    ctx.beginPath();
                    ctx.arc(mx + 8, my - 4, 16, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = 'rgba(255,255,255,0.8)';
                    for (let i = 0; i < 20; i++) {
                        const sx = (i * 137.5 + this.time * 0.01) % this.width;
                        const sy = (i * 89.3) % (this.groundY - 50);
                        ctx.beginPath();
                        ctx.arc(sx, sy, Math.random() * 1.5 + 0.5, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            }
            
            drawClouds(ctx) {
                for (const c of this.clouds) {
                    Sprite.cloud(ctx, c.x, c.y, c.size);
                }
            }
            
            drawMountains(ctx) {
                const effectiveSpeed = this.activePowerups.boost > 0 && this.state === 'playing'
                    ? this.speed * CONFIG.boostSpeedMult 
                    : this.speed;
                const offset = (this.frameCount * effectiveSpeed * 0.15) % 400;
                const colors = this.level > 6 
                    ? ['#1e293b', '#334155', '#475569']
                    : ['#94a3b8', '#cbd5e1', '#e2e8f0'];
                ctx.fillStyle = colors[2];
                for (let i = -1; i < 4; i++) {
                    const bx = i * 400 - offset;
                    ctx.beginPath();
                    ctx.moveTo(bx, this.groundY - 30);
                    ctx.lineTo(bx + 200, this.groundY - 180);
                    ctx.lineTo(bx + 400, this.groundY - 30);
                    ctx.closePath();
                    ctx.fill();
                }
                ctx.fillStyle = colors[1];
                for (let i = -1; i < 5; i++) {
                    const bx = i * 320 - (this.frameCount * effectiveSpeed * 0.25) % 320;
                    ctx.beginPath();
                    ctx.moveTo(bx, this.groundY - 20);
                    ctx.lineTo(bx + 120, this.groundY - 120);
                    ctx.lineTo(bx + 240, this.groundY - 80);
                    ctx.lineTo(bx + 320, this.groundY - 20);
                    ctx.closePath();
                    ctx.fill();
                }
            }
            
            drawHills(ctx) {
                const colors = this.level > 6
                    ? ['#334155', '#475569']
                    : ['#e2e8f0', '#f1f5f9'];
                const effectiveSpeed = this.activePowerups.boost > 0 && this.state === 'playing'
                    ? this.speed * CONFIG.boostSpeedMult 
                    : this.speed;
                const offset = (this.frameCount * effectiveSpeed * 0.4) % 300;
                ctx.fillStyle = colors[0];
                ctx.beginPath();
                ctx.moveTo(0, this.groundY);
                for (let x = 0; x <= this.width; x += 10) {
                    const y = this.groundY - 15 - Math.sin((x + offset * 2) * 0.01) * 10;
                    ctx.lineTo(x, y);
                }
                ctx.lineTo(this.width, this.groundY);
                ctx.closePath();
                ctx.fill();
                ctx.fillStyle = colors[1];
                const offset2 = (this.frameCount * effectiveSpeed * 0.5) % 250;
                for (let i = -1; i < 6; i++) {
                    const x = i * 250 - offset2;
                    ctx.beginPath();
                    ctx.ellipse(x, this.groundY - 5, 80, 15, 0, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
            
            drawGround(ctx) {
                ctx.fillStyle = this.level > 6 ? '#94a3b8' : '#f8fafc';
                ctx.fillRect(0, this.groundY, this.width, this.height - this.groundY);
                const grad = ctx.createLinearGradient(0, this.groundY, 0, this.height);
                grad.addColorStop(0, this.level > 6 ? 'rgba(148,163,184,0)' : 'rgba(248,250,252,0)');
                grad.addColorStop(1, this.level > 6 ? 'rgba(71,85,105,0.5)' : 'rgba(203,213,225,0.3)');
                ctx.fillStyle = grad;
                ctx.fillRect(0, this.groundY, this.width, this.height - this.groundY);
            }
            
            drawGroundDetail(ctx) {
                const effectiveSpeed = this.activePowerups.boost > 0 && this.state === 'playing'
                    ? this.speed * CONFIG.boostSpeedMult 
                    : this.speed;
                ctx.strokeStyle = this.level > 6 ? 'rgba(255,255,255,0.08)' : 'rgba(203,213,225,0.4)';
                ctx.lineWidth = 1.5;
                const offset = (this.frameCount * effectiveSpeed) % 120;
                for (let i = 0; i < 12; i++) {
                    const x = i * 100 - offset;
                    ctx.beginPath();
                    ctx.moveTo(x, this.groundY + 10);
                    ctx.lineTo(x - 40, this.groundY + 50);
                    ctx.stroke();
                }
                for (const line of this.groundLines) {
                    ctx.strokeStyle = this.level > 6 ? 'rgba(255,255,255,0.05)' : 'rgba(203,213,225,0.3)';
                    ctx.lineWidth = line.width;
                    ctx.beginPath();
                    ctx.moveTo(line.x, line.y);
                    ctx.lineTo(line.x - line.length, line.y + line.length * 0.3);
                    ctx.stroke();
                }
                const offset2 = (this.frameCount * effectiveSpeed) % 180;
                for (let i = -1; i < 8; i++) {
                    const x = i * 180 - offset2 + 60;
                    ctx.fillStyle = this.level > 6 ? 'rgba(255,255,255,0.1)' : 'rgba(255,255,255,0.5)';
                    ctx.beginPath();
                    ctx.ellipse(x, this.groundY + 20 + (i % 3) * 15, 35, 8, 0, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
            
            drawCoins(ctx) {
                for (const c of this.coinsArr) {
                    if (!c.collected) {
                        Sprite.coin(ctx, c.x, c.y, this.time);
                    }
                }
            }
            
            drawPowerups(ctx) {
                for (const pu of this.powerups) {
                    if (!pu.collected) {
                        Sprite.powerup(ctx, pu.x, pu.y, pu.type, this.time);
                    }
                }
            }
            
            drawFloatingTexts(ctx) {
                for (const ft of this.floatingTexts) {
                    Sprite.floatingText(ctx, ft.text, ft.x, ft.y, ft.alpha);
                }
            }
            
            drawObstacles(ctx) {
                const effectiveSpeed = this.activePowerups.boost > 0 && this.state === 'playing'
                    ? this.speed * CONFIG.boostSpeedMult 
                    : this.speed;
                const treeOffset = (this.frameCount * effectiveSpeed * 0.35) % 250;
                for (let i = -1; i < 7; i++) {
                    const x = i * 250 - treeOffset + 30;
                    Sprite.tree(ctx, x, this.groundY - 5, 0.45);
                }
                for (const obs of this.obstacles) {
                    if (obs.type === 'tree') Sprite.tree(ctx, obs.x, obs.y, obs.size);
                    else if (obs.type === 'rock') Sprite.rock(ctx, obs.x, obs.y, obs.size);
                    else if (obs.type === 'snowman') Sprite.snowman(ctx, obs.x, obs.y);
                }
            }
            
            drawPlayer(ctx) {
                let state = 'normal';
                if (this.player.jumping) state = 'jumping';
                else if (this.player.ducking) state = 'ducking';
                const invincible = this.activePowerups.boost > 0;
                Sprite.skier(ctx, this.player.x, this.player.y, state, this.time, invincible);
            }
            
            drawParticles(ctx) {
                for (const p of this.particles) {
                    ctx.globalAlpha = p.alpha * 0.8;
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.globalAlpha = 1;
            }
            
            drawBirds(ctx) {
                for (const b of this.birds) {
                    Sprite.bird(ctx, b.x, b.y, this.time);
                }
            }
            
            drawSnowflakes(ctx) {
                for (const f of this.snowflakes) {
                    ctx.globalAlpha = f.size / 4;
                    ctx.fillStyle = 'white';
                    ctx.beginPath();
                    ctx.arc(f.x, f.y, f.size, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.globalAlpha = 1;
            }
            
            drawWindEffect(ctx) {
                ctx.strokeStyle = 'rgba(255,255,255,0.08)';
                ctx.lineWidth = 1.5;
                ctx.lineCap = 'round';
                for (let i = 0; i < 8; i++) {
                    const y = (i * 67 + this.time * 0.1) % this.height;
                    const x = (this.time * 3 + i * 200) % (this.width + 300) - 150;
                    ctx.beginPath();
                    ctx.moveTo(x, y);
                    ctx.lineTo(x + 80 + i * 10, y);
                    ctx.stroke();
                }
            }
            
            loop() {
                this.update();
                this.draw();
                requestAnimationFrame(() => this.loop());
            }
        }
        
        const game = new SkiGame();
    </script>
</body>
